name: Probe GBIF speed
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; O=probe/out.txt; : > $O
          B="https://api.gbif.org/v1/occurrence/search?country=SA&hasCoordinate=true&hasGeospatialIssue=false"
          t(){ echo "== $1" >> $O; curl -s -o /tmp/r.json -w "time %{time_total}s size %{size_download}\n" "$2" >> $O; head -c 600 /tmp/r.json >> $O; echo >> $O; }
          t "page0 sparrow" "$B&speciesKey=5231190&limit=300&offset=0"
          t "page offset 15000 sparrow" "$B&speciesKey=5231190&limit=300&offset=15000"
          t "count sparrow" "$B&speciesKey=5231190&limit=0"
          t "count all birds SA" "$B&taxonKey=212&limit=0"
          t "facet gadm2 x month" "$B&speciesKey=5231190&limit=0&month=3&facet=gadmLevel2Gid&facetLimit=200"
          t "facet eqdgc" "$B&speciesKey=5231190&limit=0&facet=eqdgcCellCode&facetLimit=50"
          t "facet species all birds" "$B&taxonKey=212&limit=0&facet=speciesKey&facetLimit=1000"
          git config user.name "sheeens-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe [skip ci]" && (git push || (git pull --rebase origin main && git push))
