name: Map data

on:
  workflow_dispatch:
  schedule:
    - cron: "41 1 * * 0"   # weekly, Sunday 04:41 Riyadh
  push:
    branches: [main]
    paths: ["scripts/sync-map.mjs", ".github/workflows/map.yml"]

permissions:
  contents: write

concurrency:
  group: map
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save pngjs@7
      - run: node scripts/sync-map.mjs
      - name: Save map data
        run: |
          git config user.name "sheeens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/map
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Update map data" && (git push || (git pull --rebase -X theirs origin main && git push)); fi
